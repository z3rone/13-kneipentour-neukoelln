name: Update Map Data

on:
  push:
    paths:
      - "00 Musterseiten div Perioden seite-copy.csv"
      - "scripts/build_data.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild GeoJSON and CSV
        run: python3 scripts/build_data.py

      - name: Commit and push updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bars.geojson bars.csv
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Automated update of bars.geojson and bars.csv [skip ci]"
            git push
          fi
